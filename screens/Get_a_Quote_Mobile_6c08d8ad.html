<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<title>Auto Insurance Quote - Step 1</title>

                        "danger": "#C4293A",
                        "surface-container": "#ededfa",
                        "on-tertiary-fixed-variant": "#862300",
                        "tertiary-fixed": "#ffdbd1",
                        "surface": "#fbf8ff",

                        "success-bg": "#E7F6EF",

<style>
        /* Custom Input Styles to match guidelines */
        .form-input-minimal {
            @apply w-full h-11 px-4 border border-outline-variant rounded-lg bg-surface text-on-surface font-body text-body outline-none transition-all duration-200;
        }
        .form-input-minimal:focus {
            @apply border-primary ring-2 ring-primary/20;
        }
        .form-label-minimal {
            @apply block mb-1 font-caption text-caption text-on-surface-variant uppercase tracking-wider;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body antialiased">
<!-- Top Navigation Area (Supressed Main Nav for Transactional Flow, just a back button and simple branding) -->
<header class="w-full sticky top-0 z-50 bg-surface/90 backdrop-blur-md border-b border-surface-variant flex justify-between items-center h-16 px-4 md:px-gutter mx-auto transition-colors duration-200 ease-in-out">
<button aria-label="Go Back" class="p-2 -ml-2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="font-h3 text-h3 font-bold text-primary">
            InsureIQ
        </div>
<div class="w-10"></div> <!-- Spacer to center the logo relative to the back button -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center pt-8 pb-32 px-4 md:px-gutter max-w-xl mx-auto w-full">
<!-- Progress Indicator -->
<div class="w-full mb-10">
<div class="flex justify-between items-center mb-2">
<span class="font-overline text-overline text-on-surface-variant uppercase">Vehicle Details</span>
<span class="font-mono-data text-mono-data text-text-secondary">Step 1 of 4</span>
</div>
<div class="h-1.5 w-full bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-500 ease-out" style="width: 25%;"></div>
</div>
</div>
<!-- Section Header -->
<div class="w-full mb-8 text-center md:text-left">
<h1 class="font-h1 text-h1 text-on-surface mb-2">Tell us about your vehicle.</h1>
<p class="font-body-lg text-body-lg text-text-secondary">We'll use this to find the most accurate coverage options.</p>
</div>
<!-- Form Area -->
<form action="#" class="w-full space-y-6" method="POST">
<!-- Vehicle Year -->
<div>
<label class="form-label-minimal" for="vehicle_year">Vehicle Year</label>
<div class="relative">
<select class="form-input-minimal appearance-none pr-10 cursor-pointer bg-white" id="vehicle_year" name="vehicle_year">
<option disabled="" selected="" value="">Select Year</option>
<option value="2024">2024</option>
<option value="2023">2023</option>
<option value="2022">2022</option>
<option value="2021">2021</option>
<option value="2020">2020</option>
<option value="older">Older than 2020</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Vehicle Make -->
<div>
<label class="form-label-minimal" for="vehicle_make">Make</label>
<div class="relative">
<select class="form-input-minimal appearance-none pr-10 cursor-pointer bg-white" disabled="" id="vehicle_make" name="vehicle_make">
<option disabled="" selected="" value="">Select Make</option>
<option value="toyota">Toyota</option>
<option value="honda">Honda</option>
<option value="ford">Ford</option>
<option value="chevrolet">Chevrolet</option>
<option value="tesla">Tesla</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-outline-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
<p class="mt-1 font-caption text-caption text-text-muted">Select a year first.</p>
</div>
<!-- Vehicle Model -->
<div>
<label class="form-label-minimal" for="vehicle_model">Model</label>
<div class="relative">
<select class="form-input-minimal appearance-none pr-10 cursor-pointer bg-white" disabled="" id="vehicle_model" name="vehicle_model">
<option disabled="" selected="" value="">Select Model</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-outline-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- VIN Alternative Link -->
<div class="pt-4 text-center md:text-left">
<button class="font-body text-body text-primary hover:text-on-primary-fixed-variant transition-colors underline-offset-4 hover:underline" type="button">
                    Or enter your VIN instead
                </button>
</div>
<!-- Floating / Bottom Fixed Action Button Area (for Mobile focus) -->
<div class="fixed md:static bottom-0 left-0 w-full p-4 md:p-0 bg-surface md:bg-transparent border-t border-surface-variant md:border-none shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] md:shadow-none z-40 mt-8">
<button class="w-full h-12 bg-primary-container text-on-primary font-h3 text-h3 rounded-lg hover:bg-primary transition-colors flex items-center justify-center gap-2 shadow-sm active:scale-[0.98]" type="submit">
                    Continue to Coverages
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</form>
</main>
<script>
        // Simple interaction logic to enable fields sequentially
        document.addEventListener('DOMContentLoaded', () => {
            const yearSelect = document.getElementById('vehicle_year');
            const makeSelect = document.getElementById('vehicle_make');
            const modelSelect = document.getElementById('vehicle_model');

            yearSelect.addEventListener('change', (e) => {
                if (e.target.value) {
                    makeSelect.disabled = false;
                    makeSelect.nextElementSibling.classList.replace('text-outline-variant', 'text-on-surface-variant');
                    makeSelect.parentElement.nextElementSibling.classList.add('hidden'); // Hide hint
                }
            });

            makeSelect.addEventListener('change', (e) => {
                if (e.target.value) {
                    modelSelect.disabled = false;
                    modelSelect.nextElementSibling.classList.replace('text-outline-variant', 'text-on-surface-variant');
                    
                    // Populate dummy models based on make
                    modelSelect.innerHTML = '<option value="" disabled selected>Select Model</option>';
                    const models = ['Model A', 'Model B', 'Model C'];
                    models.forEach(model => {
                        const option = document.createElement('option');
                        option.value = model.toLowerCase().replace(' ', '_');
                        option.textContent = model;
                        modelSelect.appendChild(option);
                    });
                }
            });
        });
    </script>
</body></html>
