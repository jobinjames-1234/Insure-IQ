<body class="bg-background text-on-background font-body min-h-screen flex flex-col">
<!-- TopNavBar component logic says to hide if linear/transactional like Sign-up -->
<!-- Suppressing TopNavBar as per Semantic Shell Mandate: "Automatic Suppression: You MUST exclude the navigation shell if the page intent is: Linear/Transactional: Login, Sign-up, Onboarding..." -->
<main class="flex-grow flex items-center justify-center p-gutter">
<div class="w-full max-w-2xl bg-surface rounded-xl shadow-xs border border-outline-variant p-gutter sm:p-margin">
<div class="text-center mb-8">
<h1 class="font-display text-display text-primary mb-2">ABC Insurance</h1>
<p class="font-body-lg text-body-lg text-text-secondary">Create your account</p>
</div>
<!-- Progress Indicator -->
<div class="flex items-center justify-between mb-8 relative">
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-px bg-outline-variant z-0"></div>
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-1/3 h-px bg-primary z-0"></div>
<div class="relative z-10 flex flex-col items-center bg-surface px-2">
<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center font-caption text-caption mb-1">
                        1
                    </div>
<span class="font-caption text-caption text-primary">Details</span>
</div>
<div class="relative z-10 flex flex-col items-center bg-surface px-2">
<div class="w-8 h-8 rounded-full bg-surface-container-high text-on-surface-variant flex items-center justify-center font-caption text-caption border border-outline-variant mb-1">
                        2
                    </div>
<span class="font-caption text-caption text-on-surface-variant">Documents</span>
</div>
<div class="relative z-10 flex flex-col items-center bg-surface px-2">
<div class="w-8 h-8 rounded-full bg-surface-container-high text-on-surface-variant flex items-center justify-center font-caption text-caption border border-outline-variant mb-1">
                        3
                    </div>
<span class="font-caption text-caption text-on-surface-variant">Verification</span>
</div>
</div>
<div class="mb-6 border-b border-outline-variant pb-4">
<h2 class="font-h2 text-h2 text-on-surface mb-1">Personal Details</h2>
<p class="font-body text-body text-text-secondary">Please provide your legal name and contact information.</p>
</div>
<form class="space-y-6">
<div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
<div class="space-y-1">
<label class="font-caption text-caption text-on-surface block" for="firstName">First Name</label>
<input class="w-full h-11 px-3 border border-outline-variant rounded bg-surface text-on-surface font-body text-body focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/20 transition-all" id="firstName" placeholder="Enter first name" type="text"/>
</div>
<div class="space-y-1">
<label class="font-caption text-caption text-on-surface block" for="lastName">Last Name</label>
<input class="w-full h-11 px-3 border border-outline-variant rounded bg-surface text-on-surface font-body text-body focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/20 transition-all" id="lastName" placeholder="Enter last name" type="text"/>
</div>
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
<div class="space-y-1">
<label class="font-caption text-caption text-on-surface block" for="dob">Date of Birth</label>
<input class="w-full h-11 px-3 border border-outline-variant rounded bg-surface text-on-surface font-body text-body focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/20 transition-all" id="dob" type="date"/>
</div>
<div class="space-y-1">
<label class="font-caption text-caption text-on-surface block" for="phone">Phone Number</label>
<input class="w-full h-11 px-3 border border-outline-variant rounded bg-surface text-on-surface font-body text-body focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/20 transition-all" id="phone" placeholder="(555) 000-0000" type="tel"/>
</div>
</div>
<div class="space-y-1">
<label class="font-caption text-caption text-on-surface block" for="email">Email Address</label>
<input class="w-full h-11 px-3 border border-outline-variant rounded bg-surface text-on-surface font-body text-body focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/20 transition-all" id="email" placeholder="name@example.com" type="email"/>
</div>
<div class="space-y-1">
<label class="font-caption text-caption text-on-surface block" for="address">Home Address</label>
<input class="w-full h-11 px-3 border border-outline-variant rounded bg-surface text-on-surface font-body text-body focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/20 transition-all" id="address" placeholder="Street address" type="text"/>
</div>
<div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
<div class="space-y-1 sm:col-span-1">
<label class="font-caption text-caption text-on-surface block" for="city">City</label>
<input class="w-full h-11 px-3 border border-outline-variant rounded bg-surface text-on-surface font-body text-body focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/20 transition-all" id="city" placeholder="City" type="text"/>
</div>
<div class="space-y-1 sm:col-span-1">
<label class="font-caption text-caption text-on-surface block" for="state">State</label>
<select class="w-full h-11 px-3 border border-outline-variant rounded bg-surface text-on-surface font-body text-body focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/20 transition-all appearance-none" id="state">
<option value="">Select state</option>
<option value="NY">New York</option>
<option value="CA">California</option>
<option value="TX">Texas</option>
</select>
</div>
<div class="space-y-1 sm:col-span-1">
<label class="font-caption text-caption text-on-surface block" for="zip">ZIP Code</label>
<input class="w-full h-11 px-3 border border-outline-variant rounded bg-surface text-on-surface font-body text-body focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/20 transition-all" id="zip" placeholder="10001" type="text"/>
</div>
</div>
<div class="pt-6 flex justify-end">
<button class="h-10 px-6 bg-[#1A56FF] text-on-primary font-caption text-caption rounded shadow-xs hover:bg-[#003fd1] transition-colors flex items-center gap-2" type="button">
                        Continue to Documents
                        <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</button>
</div>
</form>
</div>
</main>
</body></html>
